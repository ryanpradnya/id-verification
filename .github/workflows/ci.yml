name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --only-group dev ruff check .
      - run: uv run --only-group dev ruff format --check .

  # The base install must work without any server dependency (invariant: core never imports server code).
  core-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - run: uv venv && uv pip install -e . pytest
      - run: .venv/bin/python -m pytest tests/test_core.py tests/test_rules.py -q

  test:
    runs-on: ubuntu-latest
    env:
      MODELS_DIR: models
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('src/id_verification/core/models.py') }}
      - run: uv sync --all-extras --frozen
      - run: uv run id-verification download-models
      - run: uv run pytest -q -rs

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: id-verification:ci
          load: true
      - name: Smoke test (lite mode, no LLM)
        run: |
          key=$(docker run --rm id-verification:ci id-verification gen-key)
          docker run -d --name idv -p 8000:8000 -e DATA_ENCRYPTION_KEY=$key -e LLM_MODEL=none id-verification:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/healthz && break; sleep 1; done
          curl -sf localhost:8000/healthz
          docker exec idv id-verification check-llm
