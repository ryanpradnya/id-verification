# Scale: Postgres + Redis/Celery + S3-compatible storage (SeaweedFS locally).
#   docker compose -f docker-compose.scale.yml up -d
#   docker compose -f docker-compose.scale.yml exec api id-verification create-tenant --name acme
# In production point DATABASE_URL / REDIS_URL / S3_* at managed services and drop those containers.

x-app: &app
  image: ghcr.io/ryanpradnya/id-verification:latest
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://kyc:kyc@postgres:5432/kyc
    REDIS_URL: redis://redis:6379/0
    S3_BUCKET: kyc
    S3_ENDPOINT_URL: http://s3:8333
    S3_ACCESS_KEY: local
    S3_SECRET_KEY: local
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kyc
      POSTGRES_PASSWORD: kyc
      POSTGRES_DB: kyc
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kyc"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
    restart: unless-stopped

  s3:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes: [s3data:/data]
    restart: unless-stopped

  migrate:
    <<: *app
    build: .  # only one service builds; api and worker reuse the image
    command: id-verification migrate
    restart: "no"
    depends_on:
      postgres: {condition: service_healthy}
      s3: {condition: service_started}

  api:
    <<: *app
    command: id-verification serve --host 0.0.0.0 --port 8000 --workers 2
    ports: ["8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  worker:
    <<: *app
    # --beat runs the daily retention purge. With several worker replicas, run beat as its own service.
    command: celery -A id_verification.server.celery_app worker --beat --schedule /tmp/celerybeat-schedule --loglevel=info --concurrency=2
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

volumes:
  pgdata:
  s3data:
