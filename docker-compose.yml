# Lite self-hosting: one container, SQLite + encrypted files in the "idv" volume, in-process worker.
#   docker compose up -d
#   docker compose exec idv id-verification create-tenant --name acme --webhook-url https://...
# Fully local model too:  docker compose --profile ollama up -d
#   then set LLM_MODEL=openai:qwen2.5vl:7b and LLM_BASE_URL=http://ollama:11434/v1 in .env
#   and pull the model once: docker compose exec ollama ollama pull qwen2.5vl:7b
# For Postgres + Redis/Celery + S3 at scale, use docker-compose.scale.yml.

services:
  idv:
    build: .
    image: ghcr.io/ryanpradnya/id-verification:latest
    env_file: .env
    ports: ["8000:8000"]
    volumes: [idv:/data]
    restart: unless-stopped

  ollama:
    profiles: [ollama]
    image: ollama/ollama:latest
    volumes: [ollama:/root/.ollama]
    restart: unless-stopped

volumes:
  idv:
  ollama:
