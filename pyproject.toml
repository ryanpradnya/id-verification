[project]
name = "id-verification"
version = "0.1.0"
description = "KYC-as-a-service: Indonesian KTP + live selfie verification (FastAPI, LangGraph, local biometrics)"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "boto3>=1.43.111",
    "celery[redis]>=5.6.3",
    "cryptography>=50.0.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain>=1.4.4",
    "langchain-anthropic>=1.7.5",
    "langchain-deepseek>=1.1.1",
    "langchain-openai>=1.7.0",
    "langchain-openrouter>=0.2.9",
    "langgraph>=1.2.14",
    "numpy>=2.5.3",
    "onnxruntime>=1.31.0",
    "opencv-python-headless>=5.0.0.93",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=6.4.0",
    "sqlalchemy>=2.1.4",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
"alembic/versions/*" = ["E501"]
